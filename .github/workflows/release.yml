name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version to validate (v<major>.<minor>.<patch>); does not publish a Release'
        type: string
        required: true
        default: 'v0.0.2'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.ref_name }}
      VIRUAISOR_RELEASE_INPUTS_URL: ${{ vars.VIRUAISOR_RELEASE_INPUTS_URL }}
      VIRUAISOR_RELEASE_INPUTS_SHA256: ${{ vars.VIRUAISOR_RELEASE_INPUTS_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate version tag
        id: version
        shell: bash
        run: python3 scripts/release_tools.py version "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check release configuration
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${VIRUAISOR_RELEASE_INPUTS_URL:?Configure the input ZIP URL; see docs/releasing.md}"
          : "${VIRUAISOR_RELEASE_INPUTS_SHA256:?Configure the input ZIP SHA-256}"
          : "${ANDROID_SIGNING_KEYSTORE_BASE64:?Missing release keystore secret}"
          : "${ANDROID_SIGNING_KEY_ALIAS:?Missing signing alias secret}"
          : "${ANDROID_SIGNING_STORE_PASSWORD:?Missing keystore password secret}"
          : "${ANDROID_SIGNING_KEY_PASSWORD:?Missing key password secret}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install build toolchains
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            meson ninja-build pkg-config python3-mako python3-yaml python3-ply \
            python3-packaging glslang-tools bison flex gettext autoconf automake \
            libtool qemu-user-static binfmt-support e2fsprogs cpio xxd \
            libexpat1-dev libwayland-dev wayland-protocols libdrm-dev \
            libxcb-randr0-dev libxcb-xfixes0-dev libx11-xcb-dev \
            libxcb-present-dev libxshmfence-dev libxrandr-dev
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;30.0.16248370'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Download verified inputs and prepare guest build root
        run: bash scripts/prepare-hosted-release.sh

      - name: Build native helpers and VM image
        shell: bash
        run: |
          bash scripts/build-release-inputs.sh
          # The release uses the ZIP; free the raw scratch image before Gradle.
          rm -f /tmp/viruaisor-manjaro/bundle/root_part

      - name: Test and assemble unsigned release APK
        shell: bash
        env:
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.versionName }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.versionCode }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease \
            "-Pviruaisor.versionName=$RELEASE_VERSION_NAME" \
            "-Pviruaisor.versionCode=$RELEASE_VERSION_CODE"

      - name: Sign and verify release APK
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_SIGNING_KEYSTORE_BASE64:?Missing release keystore secret}"
          : "${ANDROID_SIGNING_KEY_ALIAS:?Missing signing alias secret}"
          : "${ANDROID_SIGNING_STORE_PASSWORD:?Missing keystore password secret}"
          : "${ANDROID_SIGNING_KEY_PASSWORD:?Missing key password secret}"
          build_tools="$ANDROID_HOME/build-tools/37.0.0"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"
          keystore="$RUNNER_TEMP/viruaisor-release.jks"
          trap 'rm -f "$keystore" "$RUNNER_TEMP/viruaisor-aligned.apk"' EXIT
          umask 077
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$build_tools/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/viruaisor-aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_SIGNING_KEY_ALIAS" \
            --ks-pass env:ANDROID_SIGNING_STORE_PASSWORD \
            --key-pass env:ANDROID_SIGNING_KEY_PASSWORD \
            --out "$RUNNER_TEMP/viruaisor-signed.apk" \
            "$RUNNER_TEMP/viruaisor-aligned.apk"
          "$build_tools/apksigner" verify --verbose "$RUNNER_TEMP/viruaisor-signed.apk"

      - name: Validate and stage release assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_tools.py stage "$RELEASE_TAG" \
            "$RUNNER_TEMP/viruaisor-signed.apk" \
            .pi/device-debug/manjaro-plasma/manjaro-plasma-venus.zip \
            app/src/main/jniLibs/arm64-v8a \
            app/src/main/java/pro/darc/viruaisor/root/RootOverlayArtifactPolicy.kt \
            dist
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload validation artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Viruaisor-${{ env.RELEASE_TAG }}-validation
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sed "s/vX.Y.Z/$RELEASE_TAG/g" docs/release-notes.md > "$RUNNER_TEMP/viruaisor-release-notes.md"
          gh release create "$RELEASE_TAG" \
            dist/*.apk dist/*.zip dist/SHA256SUMS \
            --verify-tag --title "Viruaisor $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/viruaisor-release-notes.md"
